# Deploy deste projeto num servidor de verdade (não é o docker-compose de build local, que
# fica em ../docker/docker-compose.yml): sobe o próprio Vite dev server e deixa rodando, sem
# gerar build estático nenhum. Editou o código, o dev server já reflete na hora, igual rodar
# `npm run dev` local.
#
# Sem publicar a porta 5173 pro host de propósito: o container entra na mesma rede externa
# `infra_net` que o Nginx Proxy Manager já usa (ver contagem_carboidratos/../ na Oracle —
# infra/nginx_proxy_manager), então o NPM alcança direto pelo nome do serviço
# (contagem_carboidratos_dev:5173) dentro da rede Docker, sem precisar abrir mais nenhuma porta
# pro mundo — só 80/443 (o próprio NPM) continuam públicas.
#
# node_modules em volume nomeado (não vem do bind mount de ./app) de propósito: o app roda
# dentro de um container Linux, mas o host pode ser outra plataforma — misturar um
# node_modules instalado fora com um instalado dentro já causou binário incompatível (ver
# specs/05-build-e-deploy.md). Assim cada um cuida do próprio node_modules.
#
# A rede `infra_net` precisa já existir no host (criada junto com o Portainer/NPM) — por isso
# `external: true`, não é este compose quem cria ela.
#
#   docker compose -f contagem_carboidratos/docker-compose.yml up -d
services:
  contagem_carboidratos_dev:
    image: node:20-alpine
    container_name: contagem_carboidratos_dev
    working_dir: /site/app
    volumes:
      - ./app:/site/app
      - contagem_carboidratos_node_modules:/site/app/node_modules
    networks:
      - infra_net
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

volumes:
  contagem_carboidratos_node_modules:

networks:
  infra_net:
    external: true
